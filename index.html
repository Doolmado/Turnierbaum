<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title id="h-title">Turnierbaum</title>
<link id="h-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="h-style">
/* Layout: ein Kopfbereich, darunter horizontal scrollende Bracket-Spalten (eine Spalte je Runde), Linien als SVG-Overlay. */
:root{
  --bg:#E8EBEE; --surface:#FFFFFF; --soft:#F2F4F6; --ink:#12161C; --ink2:#566070;
  --rule:#D3D9E0; --line:#AEB7C3;
  --accent:#2440D8; --accent-ink:#FFFFFF; --accent-soft:#E2E7FF;
  --lb:#B5472B; --lb-soft:#F7E4DD; --ok:#1F8A4C; --gold:#E3AE16; --silver:#A9B2BF; --bronze:#B87333;
  --f-disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#171D25; --soft:#1D252F; --ink:#E9EDF2; --ink2:#9AA5B4;
  --rule:#27303B; --line:#3C4755;
  --accent:#8596FF; --accent-ink:#0E1217; --accent-soft:#222C57;
  --lb:#EE8963; --lb-soft:#3B2219; --ok:#5CCB8A; --gold:#F0BC2E; --silver:#C3CBD6; --bronze:#D08A4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171D25; --soft:#1D252F; --ink:#E9EDF2; --ink2:#9AA5B4;
  --rule:#27303B; --line:#3C4755;
  --accent:#8596FF; --accent-ink:#0E1217; --accent-soft:#222C57;
  --lb:#EE8963; --lb-soft:#3B2219; --ok:#5CCB8A; --gold:#F0BC2E; --silver:#C3CBD6; --bronze:#D08A4C; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopf */
.hero{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.kicker{margin:0;font:600 14px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
h1{margin:0;font:700 clamp(40px,8vw,76px)/.92 var(--f-disp);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sub{margin:0;font-size:17px;color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink2);font-size:14px}
.prog{display:flex;align-items:center;gap:12px;max-width:420px;font-size:13px;color:var(--ink2)}
.prog i{flex:1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden;display:block}
.prog b{display:block;height:100%;background:var(--accent)}
.champ{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;border-radius:6px;max-width:560px}
.champ span{font:600 13px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.champ strong{font:700 34px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em}

/* Besitzerleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:8px;margin-bottom:18px}
.bar .st{display:flex;align-items:center;gap:8px;font-size:14px;margin-right:auto;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.dirty{background:var(--lb)}
.bar .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg)}
.bar .btn:hover:not(:disabled){background:color-mix(in srgb,var(--bg) 14%,transparent)}
.bar .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.bar .btn[aria-pressed="true"]{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.seg{display:flex;gap:4px}

.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;line-height:1.2;min-height:36px}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--lb);border-color:var(--lb)}
.btn.danger.armed{background:var(--lb);color:#fff}
.in{width:100%;min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-height:38px}
.in:hover{border-color:var(--ink2)}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:22px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;cursor:pointer;
  font:600 17px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Bracket */
.blk{margin-bottom:34px}
.blk h2{margin:0 0 14px;font:700 24px var(--f-disp);text-transform:uppercase;letter-spacing:.05em}
.blk.lb h2{color:var(--lb)}
.scroll{overflow-x:auto;padding-bottom:10px}
.cols{position:relative;display:flex;gap:56px;align-items:stretch;width:max-content;min-width:100%}
.lines{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.ln{fill:none;stroke:var(--line);stroke-width:1.5}
.ln.done{stroke:var(--accent)}
.lb .ln.done{stroke:var(--lb)}
.col{position:relative;z-index:1;display:flex;flex-direction:column;width:236px}
.col h3{margin:0 0 12px;font:600 14px var(--f-disp);text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);white-space:nowrap}
.slots{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.match{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.match.click{cursor:pointer}
.match.click:hover{border-color:var(--accent)}
.match.bye,.match.inactive{opacity:.55}
.mh{display:flex;justify-content:space-between;gap:8px;padding:3px 10px;background:var(--soft);border-bottom:1px solid var(--rule);
  font:600 12px/1.5 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;padding:6px 10px;min-height:36px}
.row+.row{border-top:1px solid var(--rule)}
.sd{font:600 14px var(--f-disp);color:var(--ink2);text-align:right}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font:700 18px var(--f-disp);font-variant-numeric:tabular-nums;text-align:right;min-width:1ch}
.row.ph .nm{color:var(--ink2)}
.row.win{background:var(--accent-soft);font-weight:600}
.row.win .sc{color:var(--accent)}
.lb .row.win{background:var(--lb-soft)}
.lb .row.win .sc{color:var(--lb)}
.row.lose{color:var(--ink2)}
.empty{padding:36px 0;color:var(--ink2);max-width:52ch}
.empty .btn{margin-top:14px}

/* Teilnehmer */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th{font:600 13px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px 12px;border-bottom:2px solid var(--ink)}
td{padding:11px 12px;border-bottom:1px solid var(--rule)}
td.n{font:600 18px var(--f-disp);color:var(--ink2);width:56px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--rule);color:var(--ink2)}
.pill.sieger{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.on{border-color:var(--accent);color:var(--accent)}

.panel{display:grid;gap:22px;max-width:760px}
.panel h2{margin:0 0 4px;font:700 22px var(--f-disp);text-transform:uppercase;letter-spacing:.05em}
.panel p.h{margin:0 0 12px;color:var(--ink2);font-size:14px}
.add{display:flex;flex-wrap:wrap;gap:8px}
.add .in{flex:1 1 220px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.plist{display:grid;gap:8px}
.pe{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pe .seed{flex:0 0 64px;width:64px;text-align:center;font-weight:600}
.pe .nme{flex:2 1 160px}
.pe .clb{flex:1 1 140px}
.field{display:grid;gap:5px}
.field label,.lbl{font:600 13px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.chk small{display:block;color:var(--ink2)}
textarea.in{min-height:96px;resize:vertical}

/* Dialog */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,11,16,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:8px;width:min(420px,100%);padding:20px;display:grid;gap:14px;max-height:100%;overflow:auto}
.dlg h3{margin:0;font:700 22px var(--f-disp);text-transform:uppercase;letter-spacing:.05em}
.dlg .sub2{margin:-8px 0 0;color:var(--ink2);font-size:13px}
.pr{display:grid;grid-template-columns:1fr 76px auto;gap:10px;align-items:center}
.pr .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pr .who span{color:var(--ink2);font:600 14px var(--f-disp);margin-right:8px}
.pr input{text-align:center;font:700 20px var(--f-disp)}
.pr .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{margin:0;color:var(--ink2);font-size:13px}
.foot{margin-top:30px;color:var(--ink2);font-size:13px}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit}

#fsbar{display:none}
.podium{display:grid;gap:12px;align-items:end;max-width:760px;margin-bottom:22px}
.pd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pd .who2{font:700 clamp(18px,3.4vw,28px)/1.05 var(--f-disp);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere;max-width:100%;display:grid;gap:2px;min-height:1.1em}
.pd .lab{font:600 13px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.trophy{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.plinth{width:100%;display:grid;place-items:center;font:700 clamp(36px,8vw,64px) var(--f-disp);color:#1A1608;border-radius:6px 6px 0 0}
.pd.g1 .plinth{height:132px;background:var(--gold)}
.pd.g2 .plinth{height:100px;background:var(--silver)}
.pd.g3 .plinth{height:76px;background:var(--bronze)}
.rk td.ic{width:44px;padding-right:0}
.rk td.pl{font:700 20px var(--f-disp);width:54px;color:var(--ink2)}
.rk-h{margin:6px 0 8px;font:700 20px var(--f-disp);text-transform:uppercase;letter-spacing:.05em}
.rk tr.top td{background:var(--soft)}
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:18px}
.gcard{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px;display:grid;gap:10px;min-width:0;align-content:start}
.gcard h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 22px var(--f-disp);text-transform:uppercase;letter-spacing:.05em}
.gcard h3 small{font:600 12px var(--f-disp);letter-spacing:.12em;color:var(--ink2)}
.gt{min-width:0;font-size:14px}
.gt th,.gt td{padding:6px 7px;text-align:right}
.gt th:nth-child(2),.gt td:nth-child(2){text-align:left}
.gt td.n{width:26px;font:600 16px var(--f-disp);text-align:center}
.gt th:first-child{width:26px}
.gt tr.q td{background:var(--accent-soft)}
.gr h4{margin:8px 0 5px;font:600 12px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.gm{display:grid;grid-template-columns:30px 1fr auto 1fr;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;margin-bottom:4px;font-size:14px}
.gm>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm .gn{font:600 12px var(--f-disp);letter-spacing:.06em;color:var(--ink2)}
.gm .ga{text-align:right}
.gm .w{font-weight:600}
.gm .gs{font:700 17px var(--f-disp);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.gm.click{cursor:pointer}
.gm.click:hover{border-color:var(--accent)}
.pr.two{grid-template-columns:1fr 76px}
body.fs{padding-block:12px}
body.fs .wrap{max-width:none}
body.fs #fsbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
body.fs #hdr,body.fs #bar,body.fs #tabs,body.fs .foot,body.fs .hint{display:none}
body.fs .blk{margin-bottom:26px}
.fsbar-t{font:700 24px var(--f-disp);text-transform:uppercase;letter-spacing:.05em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsbar-t small{font:600 14px var(--f-disp);letter-spacing:.12em;color:var(--ink2);margin-left:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:min(520px,calc(100% - 32px));font-size:14px}
@media (max-width:560px){.col{width:216px}.cols{gap:44px}.pr{grid-template-columns:1fr 64px}.pr .btn{grid-column:1 / -1}}
@media (prefers-reduced-motion:no-preference){.match,.btn{transition:border-color .12s,background .12s}}
</style>

<script id="h-app">
(function(){
var BYE='~bye';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function canon(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){var r={};Object.keys(v).sort().forEach(function(x){r[x]=v[x]});return r}return v})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return String(h)}
function uid(){return 'p'+Math.random().toString(36).slice(2,8)}

function fix(st){
  st.players=st.players||[];st.results=st.results||{};
  st.format=st.format==='double'?'double':st.format==='groups'?'groups':'single';
  st.groups=Math.max(1,Math.min(8,parseInt(st.groups,10)||2));st.adv=Math.max(1,Math.min(4,parseInt(st.adv,10)||2));st.ko=st.ko==='double'?'double':'single';
  if(st.third==null)st.third=true;if(st.reset==null)st.reset=true;
  st.name=st.name||'';st.sub=st.sub||'';st.info=st.info||'';
  return st;
}
var saved=fix(JSON.parse($('#state').textContent));
var draft=clone(saved);
var canEdit=true,editMode=true,tab='bracket',modalMid=null,confirmKey=null,fsMode=false;

/* ---------- Turnierlogik ---------- */
function seedOrder(N){var o=[1];while(o.length<N){var s=o.length*2;o=o.reduce(function(a,x){a.push(x,s+1-x);return a},[])}return o}

function koFmt(st){return st.format==='groups'?st.ko:st.format}
function groupSetup(st){
  var n=st.players.length;
  if(st.format!=='groups'||n<2)return null;
  var G=Math.max(1,Math.min(st.groups||2,Math.floor(n/2))),groups=[],i;
  for(i=0;i<G;i++)groups.push([]);
  st.players.forEach(function(p,i){var row=Math.floor(i/G),c=i%G;groups[row%2===0?c:G-1-c].push(p.id)});
  var minSize=Math.min.apply(null,groups.map(function(g){return g.length}));
  var K=Math.max(1,Math.min(st.adv||2,minSize)),order=[];
  for(var p=1;p<=K;p++)for(var g=0;g<G;g++){
    var idx=(p-1)*G+g;
    if(p===2&&G%2===0)idx=G+((g+G-2)%G);
    order[idx]={g:g,p:p};
  }
  return {G:G,K:K,groups:groups,order:order};
}
function blockRounds(bl){
  return bl.groups?bl.groups.reduce(function(a,g){return a.concat(g.rounds.map(function(r){return {name:g.name+' · '+r.name,ids:r.ids}}))},[]):bl.rounds;
}
function build(st){
  var n=st.players.length;if(n<2)return null;
  var gs=groupSetup(st),m={},blocks=[],gm=[];
  var seed=function(s){return {t:'seed',s:s}},win=function(i){return {t:'win',m:i}},lose=function(i){return {t:'lose',m:i}};
  var add=function(id,a,b,x){m[id]=Object.assign({id:id,a:a,b:b},x||{})};
  if(gs){
    var gblock={key:'groups',title:'Gruppenphase',tone:'wb',groups:[]};
    gs.groups.forEach(function(ids,g){
      var list=ids.slice();if(list.length%2)list.push(null);
      var L=list.length,rounds=[],all=[];
      for(var r=0;r<L-1;r++){
        var rid=[];
        for(var i=0;i<L/2;i++){
          var a=list[i],b=list[L-1-i];
          if(a&&b){var id='G'+g+'-'+r+'-'+i;add(id,{t:'pl',id:a},{t:'pl',id:b},{kind:'grp',g:g});rid.push(id);all.push(id)}
        }
        if(rid.length)rounds.push({name:'Spieltag '+(r+1),ids:rid});
        list.splice(1,0,list.pop());
      }
      gm.push(all);
      gblock.groups.push({name:'Gruppe '+String.fromCharCode(65+g),ids:ids,rounds:rounds});
    });
    blocks.push(gblock);
  }
  var q=gs?gs.G*gs.K:n,ko=q>=2;
  var B={m:m,blocks:blocks,gs:gs,gm:gm,ko:ko,n:n,dbl:false,nums:{}};
  if(ko){
    var N=2,R=1;while(N<q){N*=2;R++}
    var so=seedOrder(N);
    if(gs){
      var ord=gs.order;
      for(var pi=0;pi<N/2;pi++){
        var x=so[2*pi],y=so[2*pi+1];
        if(x>q||y>q||ord[x-1].g!==ord[y-1].g)continue;
        for(var z=1;z<=q;z++){
          if(z===x||z===y||ord[z-1].p!==ord[y-1].p)continue;
          var w=so[so.indexOf(z)^1];
          if(ord[x-1].g===ord[z-1].g)continue;
          if(w<=q&&ord[w-1].g===ord[y-1].g)continue;
          var tmp=ord[y-1];ord[y-1]=ord[z-1];ord[z-1]=tmp;break;
        }
      }
    }
    var sseed=function(s){return gs?(s>q?{t:'bye'}:{t:'grp',g:gs.order[s-1].g,p:gs.order[s-1].p}):seed(s)};
    var dbl=koFmt(st)==='double'&&R>=2;
    var wb=[];
    for(var r=1;r<=R;r++){
      var cnt=N/Math.pow(2,r),ids=[];
      for(var i=0;i<cnt;i++){
        var id='W'+r+'-'+i;
        add(id,r===1?sseed(so[2*i]):win('W'+(r-1)+'-'+(2*i)),r===1?sseed(so[2*i+1]):win('W'+(r-1)+'-'+(2*i+1)));
        ids.push(id);
      }
      var name=dbl?(r===R?'Winners Finale':'Winners Runde '+r):(['Finale','Halbfinale','Viertelfinale','Achtelfinale'][R-r]||'Runde '+r);
      wb.push({name:name,ids:ids});
    }
    blocks.push({key:'wb',title:dbl?'Winners Bracket':(gs?'K.-o.-Runde':'Turnierbaum'),tone:'wb',rounds:wb});
    if(dbl){
      var lb=[];
      for(var k=1;k<=R-1;k++){
        var c=N/Math.pow(2,k+1),i1=[],i2=[];
        for(var i=0;i<c;i++){
          var id1='L'+(2*k-1)+'-'+i;
          add(id1,k===1?lose('W1-'+(2*i)):win('L'+(2*k-2)+'-'+(2*i)),k===1?lose('W1-'+(2*i+1)):win('L'+(2*k-2)+'-'+(2*i+1)));
          i1.push(id1);
        }
        lb.push({name:'Losers Runde '+(2*k-1),ids:i1});
        for(var i=0;i<c;i++){
          var id2='L'+(2*k)+'-'+i,j=(k%2===1)?c-1-i:i;
          add(id2,win('L'+(2*k-1)+'-'+i),lose('W'+(k+1)+'-'+j));
          i2.push(id2);
        }
        lb.push({name:'Losers Runde '+(2*k),ids:i2});
      }
      lb[lb.length-1].name='Losers Finale';
      blocks.push({key:'lb',title:'Losers Bracket',tone:'lb',rounds:lb});
      var a=win('W'+R+'-0'),b=win('L'+(2*(R-1))+'-0');
      add('GF1',a,b);
      var fr=[{name:'Grand Final',ids:['GF1']}];
      if(st.reset){add('GF2',a,b);fr.push({name:'Reset-Finale',ids:['GF2']})}
      blocks.push({key:'gf',title:'Finale',tone:'wb',rounds:fr});
    }else if(st.third&&R>=2){
      add('T',lose('W'+(R-1)+'-0'),lose('W'+(R-1)+'-1'));
      blocks.push({key:'t',title:'Spiel um Platz 3',tone:'wb',rounds:[{name:'Platz 3',ids:['T']}]});
    }
    B.N=N;B.R=R;B.dbl=dbl;
  }
  var num=0;
  blocks.forEach(function(bl){blockRounds(bl).forEach(function(rd){rd.ids.forEach(function(id){B.nums[id]=++num;m[id].rname=rd.name})})});
  return B;
}

function hasScores(r,a,b){return r&&r.s&&r.s[a]!=null&&r.s[b]!=null}
function groupTables(st,B){
  return B.gs.groups.map(function(ids,gi){
    var rows={},done=0;
    ids.forEach(function(id){rows[id]={id:id,seed:st.players.findIndex(function(p){return p.id===id}),p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});
    B.gm[gi].forEach(function(mid){
      var m=B.m[mid],a=m.a.id,b=m.b.id,r=st.results[mid];
      if(!hasScores(r,a,b))return;
      done++;
      var x=rows[a],y=rows[b],sa=Number(r.s[a]),sb=Number(r.s[b]);
      x.p++;y.p++;x.gf+=sa;x.ga+=sb;y.gf+=sb;y.ga+=sa;
      if(sa>sb){x.w++;y.l++;x.pts+=3}else if(sb>sa){y.w++;x.l++;y.pts+=3}else{x.d++;y.d++;x.pts++;y.pts++}
    });
    var list=ids.map(function(id){return rows[id]});
    list.sort(function(u,v){return v.pts-u.pts||(v.gf-v.ga)-(u.gf-u.ga)||v.gf-u.gf||u.seed-v.seed});
    return {rows:list,complete:done===B.gm[gi].length,done:done,total:B.gm[gi].length};
  });
}

function resolveAll(st,B){
  var n=st.players.length,memo={},GT=B.gs?groupTables(st,B):[];
  Object.defineProperty(memo,'_gt',{value:GT});
  function slot(src){
    if(src.t==='seed')return src.s<=n?st.players[src.s-1].id:BYE;
    if(src.t==='bye')return BYE;
    if(src.t==='pl')return src.id;
    if(src.t==='grp'){var t=GT[src.g];return t.complete&&t.rows[src.p-1]?t.rows[src.p-1].id:null}
    var r=res(src.m);return src.t==='win'?r.w:r.l;
  }
  function res(id){
    if(memo[id])return memo[id];
    var m=B.m[id],a=slot(m.a),b=slot(m.b);
    var o={id:id,a:a,b:b,w:null,l:null,bye:false,played:false,inactive:false,draw:false};
    memo[id]=o;
    var r=st.results[id];
    if(m.kind==='grp'){
      if(hasScores(r,a,b)){
        o.played=true;
        if(r.s[a]>r.s[b]){o.w=a;o.l=b}else if(r.s[b]>r.s[a]){o.w=b;o.l=a}else o.draw=true;
      }
      return o;
    }
    if(id==='GF2'){var g=res('GF1');if(!(g.played&&g.w===g.b)){o.inactive=true;return o}}
    if(a===BYE&&b===BYE){o.bye=true;o.w=BYE;o.l=BYE}
    else if(a===BYE){o.bye=true;o.w=b;o.l=BYE}
    else if(b===BYE){o.bye=true;o.w=a;o.l=BYE}
    else if(a&&b&&r&&(r.w===a||r.w===b)){o.w=r.w;o.l=r.w===a?b:a;o.played=true}
    return o;
  }
  Object.keys(B.m).forEach(res);
  return memo;
}

function normalize(st){
  var B=build(st);if(!B){st.results={};return}
  var R=resolveAll(st,B),out={};
  Object.keys(st.results).forEach(function(id){
    var o=R[id],r=st.results[id];
    if(!o||o.bye||o.inactive||!o.a||!o.b)return;
    var s={};
    [o.a,o.b].forEach(function(p){if(r.s&&r.s[p]!=null&&r.s[p]!==''&&!isNaN(r.s[p]))s[p]=Number(r.s[p])});
    var w=(B.m[id].kind!=='grp'&&(r.w===o.a||r.w===o.b))?r.w:null;
    if(w||Object.keys(s).length)out[id]={s:s,w:w};
  });
  st.results=out;
}

function summary(st){
  var B=build(st);
  if(!B)return {B:null,R:{},total:0,played:0,champ:null,stats:{},elim:{}};
  var R=resolveAll(st,B),total=0,played=0,stats={},elim={};
  st.players.forEach(function(p){stats[p.id]={w:0,d:0,l:0,kl:0}});
  Object.keys(R).forEach(function(id){
    var o=R[id];if(o.bye||o.inactive)return;
    total++;
    if(o.played){
      played++;
      if(o.draw){stats[o.a].d++;stats[o.b].d++}
      else{stats[o.w].w++;stats[o.l].l++;if(B.m[id].kind!=='grp')stats[o.l].kl++}
    }
  });
  if(B.gs)R._gt.forEach(function(t){if(t.complete)t.rows.forEach(function(r,i){if(i>=B.gs.K)elim[r.id]=1})});
  var champ=null;
  if(B.ko){
    if(B.dbl){
      var g=R.GF1;
      if(g.played){
        if(!st.reset||g.w===g.a)champ=g.w;
        else if(R.GF2&&R.GF2.played)champ=R.GF2.w;
      }
    }else champ=R['W'+B.R+'-0'].played?R['W'+B.R+'-0'].w:null;
  }
  if(!B.ko&&B.gs&&R._gt.length&&R._gt.every(function(t){return t.complete}))champ=R._gt[0].rows[0].id;
  return {B:B,R:R,total:total,played:played,champ:champ,stats:stats,elim:elim};
}

function ranking(st,S){
  var B=S.B,R=S.R;
  if(!B||S.champ==null)return null;
  var T=R.T;
  if(T&&!T.played)return null;
  var list=[],next;
  var push=function(place,ids){ids.forEach(function(id){if(id&&id!==BYE)list.push({id:id,place:place})})};
  if(!B.ko){
    R._gt[0].rows.forEach(function(r,i){list.push({id:r.id,place:i+1})});
  }else{
    push(1,[S.champ]);
    var fl;
    if(B.dbl){var g1=R.GF1,g2=R.GF2;fl=(g1.w===g1.b&&st.reset&&g2&&g2.played)?g2.l:g1.l}
    else fl=R['W'+B.R+'-0'].l;
    push(2,[fl]);next=3;
    var losers=function(ids){return ids.map(function(id){return R[id]}).filter(function(o){return o.played}).map(function(o){return o.l})};
    if(B.dbl){
      var lbr=B.blocks.filter(function(b){return b.key==='lb'})[0].rounds;
      for(var k=lbr.length-1;k>=0;k--){var ls=losers(lbr[k].ids);push(next,ls);next+=ls.length}
    }else{
      var wbr=B.blocks.filter(function(b){return b.key==='wb'})[0].rounds;
      if(T){push(3,[T.w]);push(4,[T.l]);next=5}
      for(var r=B.R-1;r>=1;r--){
        if(T&&r===B.R-1)continue;
        var ls2=losers(wbr[r-1].ids);push(next,ls2);next+=ls2.length;
      }
    }
    if(B.gs){
      var rest=[];
      R._gt.forEach(function(t){t.rows.forEach(function(r,i){if(i>=B.gs.K)rest.push({id:r.id,i:i,pts:r.pts,gd:r.gf-r.ga,gf:r.gf,seed:r.seed})})});
      rest.sort(function(a,b){return a.i-b.i||b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.seed-b.seed});
      rest.forEach(function(r,i){list.push({id:r.id,place:next+i})});
    }
  }
  list.sort(function(a,b){return a.place-b.place});
  var top={1:[],2:[],3:[]};
  list.forEach(function(e){if(top[e.place])top[e.place].push(e.id)});
  return {list:list,top:top};
}
function podiumHtml(rk){

    return '<div class="pd '+cls+'">'+trophy(kind,size)+'<div class="who2">'+ids.map(function(id){return '<span>'+nm(id)+'</span>'}).join('')+'</div><span class="lab">'+label+'</span><div class="plinth">'+place+'</div></div>';

    return '<tr'+(k?' class="top"':'')+'><td class="pl">'+e.place+'.</td><td class="ic">'+(k?trophy(k,28):'')+'</td><td>'+nm(e.id)+'</td>'+(p&&p.club?'<td>'+esc(p.club)+'</td>':'<td></td>')+'</tr>';

  var R=S.R;

  }
  function gmatch(id){
    var o=R[id],r=draft.results[id],pa=pl(o.a),pb=pl(o.b);
    var sa=o.played?r.s[o.a]:'–',sb=o.played?r.s[o.b]:'–';

     +'<span class="ga'+(o.w===o.a?' w':'')+'">'+esc(pa?pa.name:'?')+'</span><span class="gs">'+esc(sa)+' : '+esc(sb)+'</span><span class="gb'+(o.w===o.b?' w':'')+'">'+esc(pb?pb.name:'?')+'</span></div>';
  }
  function groupsHtml(bl){

      var t=GT[gi];
      var rows=t.rows.map(function(r,i){
        var p=pl(r.id),gd=r.gf-r.ga;
        return '<tr'+(i<K?' class="q"':'')+'><td class="n">'+(i+1)+'</td><td class="nm2">'+esc(p?p.name:'?')+'</td><td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+(gd>0?'+':'')+gd+'</td><td><b>'+r.pts+'</b></td></tr>';
      }).join('');
      return '<div class="gcard"><h3>'+esc(g.name)+'<small>'+t.done+' / '+t.total+' Spiele</small></h3>'
       +'<div class="tbl-wrap"><table class="gt"><thead><tr><th></th><th>Name</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Diff</th><th>Pkt</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
       +g.rounds.map(function(rd){return '<div class="gr"><h4>'+esc(rd.name)+'</h4>'+rd.ids.map(gmatch).join('')+'</div>'}).join('')+'</div>';
    }).join('')+'</div><p class="hint" style="margin-top:12px">Die ersten '+K+' jeder Gruppe kommen weiter (farbig). Sieg 3 Punkte, Unentschieden 1. Bei Gleichstand entscheiden Tordifferenz, erzielte Punkte und dann der Seed.</p></section>';
  }
  return podiumHtml(ranking(draft,S))+B.blocks.map(function(bl){
    if(bl.groups)return groupsHtml(bl);
    return '<section class="blk '+bl.tone+'"><h2>'+esc(bl.title)+'</h2><div class="scroll"><div class="cols" data-blk="'+bl.key+'">'
     +bl.rounds.map(function(rd){return '<div class="col"><h3>'+esc(rd.name)+'</h3><div class="slots">'+rd.ids.map(card).join('')+'</div></div>'}).join('')
     +'</div></div></section>';
  }).join('')+(can()?'<p class="hint">Tippe auf ein Spiel, um das Ergebnis einzutragen.</p>':'');
}
function drawLines(){
  var S=summary(draft),B=S.B;if(!B)return;
  document.querySelectorAll('.cols').forEach(function(cols){
    var old=cols.querySelector('svg.lines');if(old)old.remove();
    var cr=cols.getBoundingClientRect(),d='',dd='';
    cols.querySelectorAll('.match').forEach(function(el){
      var m=B.m[el.dataset.mid];
      [m.a,m.b].forEach(function(src){
        if(src.t!=='win')return;
        var se=cols.querySelector('.match[data-mid="'+src.m+'"]');if(!se)return;
        var r1=se.getBoundingClientRect(),r2=el.getBoundingClientRect();
        var x1=r1.right-cr.left,y1=r1.top+r1.height/2-cr.top,x2=r2.left-cr.left,y2=r2.top+r2.height/2-cr.top,xm=x1+(x2-x1)/2;
        var p='M'+x1+' '+y1+'H'+xm+'V'+y2+'H'+x2;
        if(S.R[src.m].played)dd+=p;else d+=p;
      });
    });
    cols.insertAdjacentHTML('afterbegin','<svg class="lines" width="'+cols.scrollWidth+'" height="'+cols.scrollHeight+'" aria-hidden="true"><path class="ln" d="'+d+'"/><path class="ln done" d="'+dd+'"/></svg>');
  });
}
function playersView(){
  var S=summary(draft);
  if(!draft.players.length)return '<div class="empty"><p>Noch keine Teilnehmer eingetragen.</p></div>';
  var hasClub=draft.players.some(function(p){return p.club});
  var rows=draft.players.map(function(p,i){
    var s=S.stats[p.id]||{w:0,d:0,l:0,kl:0},status='',cls='';
    if(S.B){
      if(S.champ===p.id){status='Sieger';cls='sieger'}
      else if(S.champ||S.elim[p.id]||s.kl>=(S.B.dbl?2:1)){status='Ausgeschieden'}
      else{status='Im Rennen';cls='on'}
    }
    return '<tr><td class="n">'+(i+1)+'</td><td>'+esc(p.name||'–')+'</td>'+(hasClub?'<td>'+esc(p.club)+'</td>':'')+'<td>'+(S.B&&S.B.gs?s.w+' · '+s.d+' · '+s.l:s.w+' : '+s.l)+'</td><td>'+(status?'<span class="pill '+cls+'">'+status+'</span>':'')+'</td></tr>';
  }).join('');
  return '<div class="tbl-wrap"><table><thead><tr><th>Seed</th><th>Teilnehmer</th>'+(hasClub?'<th>Verein / Team</th>':'')+'<th>'+(S.B&&S.B.gs?'S · U · N':'Siege : Niederl.')+'</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function playersEdit(){
  var n=draft.players.length;
  var list=draft.players.map(function(p,i){
    return '<div class="pe"><input class="in seed" id="sd-'+p.id+'" type="number" min="1" max="'+n+'" value="'+(i+1)+'" data-f="seed" data-i="'+i+'" aria-label="Seed von '+esc(p.name)+'">'
     +'<input class="in nme" id="pn-'+p.id+'" value="'+esc(p.name)+'" data-f="pname" data-i="'+i+'" placeholder="Name" aria-label="Name">'
     +'<input class="in clb" id="pc-'+p.id+'" value="'+esc(p.club)+'" data-f="pclub" data-i="'+i+'" placeholder="Verein / Team (optional)" aria-label="Verein oder Team">'
     +'<button class="btn" data-a="rmp" data-i="'+i+'" aria-label="'+esc(p.name)+' entfernen">✕</button></div>';
  }).join('');
  return '<div class="panel">'
   +'<section><h2>Teilnehmer hinzufügen</h2><p class="h">Die Reihenfolge ist die Setzliste: Platz 1 ist Seed 1. Seed 1 spielt in Runde 1 gegen den niedrigsten Seed. Bei ungerader Zahl bekommen die höchsten Seeds ein Freilos.'+(draft.format==='groups'?' In der Gruppenphase werden die Seeds im Schlangensystem auf die Gruppen verteilt.':'')+'</p>'
   +'<div class="add"><input class="in" id="np" placeholder="Name eingeben, Enter zum Hinzufügen"><button class="btn primary" data-a="addp">Hinzufügen</button></div></section>'
   +'<section><div class="field"><label for="bulk">Mehrere auf einmal (ein Name pro Zeile)</label><textarea class="in" id="bulk" placeholder="Anna&#10;Jonas&#10;Mira"></textarea></div><div style="margin-top:8px"><button class="btn" data-a="addmany">Liste übernehmen</button></div></section>'
   +'<section><h2>Setzliste</h2><div class="tools" style="margin-bottom:12px"><button class="btn" data-a="shuffle">Zufällig mischen</button><button class="btn" data-a="sortaz">A–Z sortieren</button><button class="btn" data-a="reverse">Reihenfolge umkehren</button></div>'
   +(n?'<div class="plist">'+list+'</div>':'<p class="h">Noch niemand eingetragen.</p>')+'</section></div>';
}
function koF(d){return d.format==='groups'?d.ko:d.format}
function groupSettings(d){
  var gs=groupSetup(d),opt=function(from,to,cur){var o='';for(var i=from;i<=to;i++)o+='<option value="'+i+'"'+(i===cur?' selected':'')+'>'+i+'</option>';return o};
  var info=gs?gs.G+' Gruppe'+(gs.G>1?'n':'')+' mit '+gs.groups.map(function(g){return g.length}).join(' / ')+' Teilnehmern. Es kommen '+gs.K+' pro Gruppe weiter ('+(gs.G*gs.K)+' im K.-o.-System).':'Mindestens 2 Teilnehmer nötig.';
  return '<section class="field"><label for="f-groups">Anzahl Gruppen</label><select class="in" id="f-groups" data-f="groups">'+opt(1,8,d.groups)+'</select></section>'
   +'<section class="field"><label for="f-adv">Aufsteiger pro Gruppe</label><select class="in" id="f-adv" data-f="adv">'+opt(1,4,d.adv)+'</select><p class="hint">'+esc(info)+'</p></section>'
   +'<section class="field"><label for="f-ko">Modus der K.-o.-Runde</label><select class="in" id="f-ko" data-f="ko"><option value="single"'+(d.ko==='single'?' selected':'')+'>Single Elimination</option><option value="double"'+(d.ko==='double'?' selected':'')+'>Double Elimination</option></select></section>';
}
function settingsHtml(){
  var d=draft;
  return '<div class="panel">'
   +'<section class="field"><label for="f-name">Turniername</label><input class="in" id="f-name" data-f="name" value="'+esc(d.name)+'" placeholder="z. B. Sommer Cup"></section>'
   +'<section class="field"><label for="f-sub">Untertitel / Disziplin</label><input class="in" id="f-sub" data-f="sub" value="'+esc(d.sub)+'" placeholder="z. B. Tischtennis · Einzel"></section>'
   +'<section class="field"><label for="f-info">Termin / Ort</label><input class="in" id="f-info" data-f="info" value="'+esc(d.info)+'" placeholder="z. B. Sa, 14. Juni · Vereinsheim"></section>'
   +'<section class="field"><label for="f-format">Turniermodus</label><select class="in" id="f-format" data-f="format"><option value="single"'+(d.format==='single'?' selected':'')+'>Single Elimination (K.-o.-System)</option><option value="double"'+(d.format==='double'?' selected':'')+'>Double Elimination (zwei Niederlagen)</option><option value="groups"'+(d.format==='groups'?' selected':'')+'>Gruppenphase + K.-o.-Runde</option></select></section>'
   +(d.format==='groups'?groupSettings(d):'')
   +(koF(d)==='single'
     ?'<label class="chk" for="f-third"><input type="checkbox" id="f-third" data-f="third"'+(d.third?' checked':'')+'><span>Spiel um Platz 3<small>Die beiden Halbfinal-Verlierer spielen um Bronze.</small></span></label>'
     :'<label class="chk" for="f-reset"><input type="checkbox" id="f-reset" data-f="reset"'+(d.reset?' checked':'')+'><span>Grand-Final-Reset<small>Gewinnt der Spieler aus dem Losers Bracket das Grand Final, gibt es ein zweites Finale.</small></span></label>')
   +'<section><h2>Zurücksetzen</h2><p class="h">Änderungen an Teilnehmern oder Modus nach Turnierbeginn können bereits eingetragene Ergebnisse löschen. Sichere das Turnier vorher mit „Sichern“ oben.</p><div class="tools">'
   +'<button class="btn danger'+(confirmKey==='res'?' armed':'')+'" data-a="resetres">'+(confirmKey==='res'?'Wirklich alle Ergebnisse löschen?':'Alle Ergebnisse löschen')+'</button>'
   +'<button class="btn danger'+(confirmKey==='new'?' armed':'')+'" data-a="newt">'+(confirmKey==='new'?'Wirklich alles löschen?':'Neues leeres Turnier')+'</button></div></section></div>';
}

/* ---------- Änderungen ---------- */
function persist(){
  try{localStorage.setItem('tb-data',JSON.stringify(draft))}catch(e){}
}
function commit(full){
  normalize(draft);
  persist();
  if(full)refresh();else{renderHdr();renderFs()}
}
function setScore(pid,val){
  var o=summary(draft).R[modalMid];if(!o)return;
  var r=draft.results[modalMid]||(draft.results[modalMid]={s:{},w:null});
  if(val===''||isNaN(val))delete r.s[pid];else r.s[pid]=Number(val);
  var sa=r.s[o.a],sb=r.s[o.b];
  if(summary(draft).B.m[modalMid].kind!=='grp'&&sa!=null&&sb!=null&&sa!==sb)r.w=sa>sb?o.a:o.b;
  commit(false);renderPane();
  syncWinBtns(o);
}
function syncWinBtns(o){
  var r=draft.results[modalMid]||{w:null};
  document.querySelectorAll('#modal [data-a="win"]').forEach(function(b){
    var on=r.w===b.dataset.pid;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);
  });
}
function setWinner(pid){
  var r=draft.results[modalMid]||(draft.results[modalMid]={s:{},w:null});
  var before=Object.keys(draft.results).length;
  r.w=r.w===pid?null:pid;
  commit(true);
  if(Object.keys(draft.results).length<before)toast('Folgespiele mit geänderter Paarung wurden zurückgesetzt.');
}
function move(i,to){
  var a=draft.players;to=Math.max(0,Math.min(a.length-1,to));
  var p=a.splice(i,1)[0];a.splice(to,0,p);
}
function addPlayers(names){
  names.forEach(function(nm){nm=nm.trim();if(nm)draft.players.push({id:uid(),name:nm,club:''})});
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,v=el.dataset.v;
  if(a==='closeov'&&e.target!==el)return;
  if(a==='tab'){tab=v;confirmKey=null;renderTabs();renderPane();return}
  if(a==='fs'){setFs(true);return}
  if(a==='fsx'){setFs(false);return}
  if(a==='mode'){editMode=v==='edit';modalMid=null;confirmKey=null;refresh();return}
  if(a==='export'){
    var blob=new Blob([JSON.stringify(draft,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
    l.href=u;l.download=((draft.name||'turnier').toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').replace(/^-|-$/g,'')||'turnier')+'.json';
    document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);return}
  if(a==='import'){$('#imp').click();return}
  if(a==='open'&&can()){modalMid=el.dataset.mid;renderModal();var f=document.querySelector('#modal input');if(f)f.focus();return}
  if(a==='close'||a==='closeov'){modalMid=null;renderModal();return}
  if(a==='win'){setWinner(el.dataset.pid);return}
  if(a==='clearres'){delete draft.results[modalMid];modalMid=null;commit(true);return}
  if(a==='addp'){var i=$('#np');addPlayers([i.value]);commit(true);var n=$('#np');if(n)n.focus();return}
  if(a==='addmany'){addPlayers($('#bulk').value.split(/\r?\n/));commit(true);return}
  if(a==='rmp'){draft.players.splice(+el.dataset.i,1);commit(true);return}
  if(a==='shuffle'){var p=draft.players;for(var i=p.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=p[i];p[i]=p[j];p[j]=t}commit(true);return}
  if(a==='sortaz'){draft.players.sort(function(x,y){return x.name.localeCompare(y.name,'de')});commit(true);return}
  if(a==='reverse'){draft.players.reverse();commit(true);return}
  if(a==='resetres'){if(confirmKey==='res'){draft.results={};confirmKey=null;commit(true);toast('Ergebnisse gelöscht.')}else{confirmKey='res';renderPane()}return}
  if(a==='newt'){if(confirmKey==='new'){draft=fix({name:'',sub:'',info:'',format:'single',players:[],results:{}});confirmKey=null;commit(true);toast('Neues leeres Turnier angelegt.')}else{confirmKey='new';renderPane()}return}
});
document.addEventListener('input',function(e){
  if(!canEdit)return;
  var t=e.target,f=t.dataset.f;
  if(f==='name'||f==='sub'||f==='info'){draft[f]=t.value;commit(false)}
  else if(f==='pname'){draft.players[+t.dataset.i].name=t.value;commit(false)}
  else if(f==='pclub'){draft.players[+t.dataset.i].club=t.value;commit(false)}
  else if(t.dataset.pid&&modalMid){setScore(t.dataset.pid,t.value)}
});
document.addEventListener('change',function(e){
  if(!canEdit)return;
  var t=e.target,f=t.dataset.f;
  if(f==='format'){draft.format=t.value;commit(true)}
  else if(f==='groups'||f==='adv'){draft[f]=parseInt(t.value,10)||2;commit(true)}
  else if(f==='ko'){draft.ko=t.value;commit(true)}
  else if(f==='third'||f==='reset'){draft[f]=t.checked;commit(true)}
  else if(t.id==='imp'){var fl=t.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){try{var d=fix(JSON.parse(rd.result));if(!Array.isArray(d.players))throw 0;draft=d;modalMid=null;commit(true);toast('Turnier geladen.')}catch(x){toast('Die Datei ist kein gültiges Turnier.')}t.value=''};rd.readAsText(fl)}
  else if(f==='seed'){move(+t.dataset.i,(parseInt(t.value,10)||1)-1);commit(true)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&modalMid){modalMid=null;renderModal();return}
  if(e.key==='Escape'&&fsMode&&!document.fullscreenElement){setFs(false);return}
  if(e.key==='Enter'){
    if(e.target.id==='np'&&canEdit){addPlayers([e.target.value]);commit(true);var n=$('#np');if(n)n.focus()}
    else if(e.target.classList&&(e.target.classList.contains('match')||e.target.classList.contains('gm'))&&e.target.dataset.a==='open'&&can()){modalMid=e.target.dataset.mid;renderModal();var f=document.querySelector('#modal input');if(f)f.focus()}
  }
});

/* ---------- Start ---------- */
try{
  var ls=JSON.parse(localStorage.getItem('tb-data')||'null');
  if(ls&&Array.isArray(ls.players))draft=fix(ls);
}catch(e){}
normalize(draft);
refresh();
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&fsMode)setFs(false)});
var raf=0;
window.addEventListener('resize',function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){if(tab==='bracket')drawLines()})});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(tab==='bracket')drawLines()});
})();
</script>
</body>
</html>
